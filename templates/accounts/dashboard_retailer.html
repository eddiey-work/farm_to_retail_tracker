{% extends 'base.html' %}

{% block title %}Retailer Dashboard{% endblock %}

{% block content %}
<div class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="text-success mb-0">
            <i class="bi bi-cart-check"></i> Retailer Dashboard
        </h2>
        <span class="badge bg-success fs-6">{{ user.username }}</span>
    </div>

    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="card p-3">
                <div class="text-muted small">My Orders</div>
                <div class="fs-3 fw-bold text-success">0</div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card p-3">
                <div class="text-muted small">Pending</div>
                <div class="fs-3 fw-bold text-success">0</div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card p-3">
                <div class="text-muted small">Total Spend (PKR)</div>
                <div class="fs-3 fw-bold text-success">0</div>
            </div>
        </div>
    </div>

    <div class="card p-4">
        <h5>Quick actions</h5>
        <p class="text-muted small">
            The marketplace arrives on Day 8. You'll be able to browse and order then.
        </p>
        <div>
            <button class="btn btn-success" disabled>
                <i class="bi bi-shop"></i> Browse Marketplace (coming soon)
            </button>
        </div>
    </div>
</div>
{% endblock %}
